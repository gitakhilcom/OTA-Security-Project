name: Run Firmware Tests

on:
  push:
    branches: [ Member-2 ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Run tests
        run: python -m unittest test_firmware_hash -v
