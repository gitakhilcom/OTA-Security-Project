name: CI - Sign + Verify Firmware

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          pytest test_signer.py -v

      - name: Create RSA Keys
        env:
          PRIVATE_KEY_DATA: ${{ secrets.PRIVATE_KEY }}
        run: |
          echo "$PRIVATE_KEY_DATA" > private_key.pem
          openssl rsa -pubout -in private_key.pem -out public_key.pem

      - name: Sign Firmware
        run: |
          python sign_firmware.py \
            --key private_key.pem \
            --firmware firmware.bin \
            --out dist

      - name: Verify Firmware Signature
        run: |
          python verify_firmware.py \
            firmware.bin \
            dist/firmware.sig \
            public_key.pem

      - name: Test Firmware Download
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python download_firmware.py

      - name: Test Rollback Guard
        run: |
          python rollback_guard.py || true

      - name: Test Simulated Device
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python simulated_device.py

      - name: Cleanup
        if: always()
        run: |
          rm -f private_key.pem public_key.pem