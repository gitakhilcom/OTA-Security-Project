name: Sign Firmware

on:
  push:
    tags:
      - 'v*'
jobs:
  sign:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install cryptography

      - name: Sign firmware
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: python signing/sign_firmware.py